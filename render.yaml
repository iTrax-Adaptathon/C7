# Render Blueprint — deploys both services from this repo in one click:
# Render dashboard -> New -> Blueprint -> select this repo -> Apply.
#
# NOTE: "adaptive-fitness-api" was already taken by an unrelated project on
# Render's platform (service names/URLs are global, not per-account), so
# Render silently assigned a suffixed hostname instead of erroring. The
# actual deployed URL is https://adaptive-fitness-api-hmcl.onrender.com --
# VITE_API_BASE_URL below is hardcoded to that real URL, not the name in
# this file. If this blueprint is ever re-applied from scratch (new
# account, renamed service, etc.), check the actual assigned URL in the
# Render dashboard and update VITE_API_BASE_URL to match before relying on
# this file, since Render does not support building the value from another
# service's URL directly in a static site's env var.

services:
  - type: web
    name: adaptive-fitness-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./fitness.db
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: adaptive-fitness-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://adaptive-fitness-api-hmcl.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
