# Render Blueprint — deploys both services from this repo in one click:
# Render dashboard -> New -> Blueprint -> select this repo -> Apply.
#
# `adaptive-fitness-api` is a fixed, predictable service name so its public
# URL (https://adaptive-fitness-api.onrender.com) can be hardcoded as the
# frontend's build-time API base below, with no manual wiring between the
# two deploys. If Render reports that name is already taken (unlikely, but
# names are global on the platform), rename the service in this file to
# something unique AND update VITE_API_BASE_URL to match before applying.

services:
  - type: web
    name: adaptive-fitness-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./fitness.db
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: adaptive-fitness-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://adaptive-fitness-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
